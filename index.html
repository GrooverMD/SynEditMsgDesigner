<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynEdit .msg Designer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* ── Design tokens ────────────────────────────────────────────────────────── */
:root {
  /* Surface */
  --s0: #0f1117;   /* deepest – window bg */
  --s1: #171b26;   /* panel bg */
  --s2: #1e2334;   /* card / input bg */
  --s3: #252c3f;   /* hover / chip bg */
  --s4: #2e3650;   /* border */
  --s5: #3d4a6b;   /* border strong */

  /* Text */
  --t0: #e8ecf4;   /* primary */
  --t1: #8b92a8;   /* secondary */
  --t2: #525b75;   /* muted */

  /* Accent – indigo glow */
  --a:    #6c8aff;
  --a-bg: rgba(108,138,255,.12);
  --a-bd: rgba(108,138,255,.4);

  /* Danger */
  --d:    #f06060;
  --d-bg: rgba(240,96,96,.1);

  /* Lane accent colours – richer, less saturated */
  --lh: #9d8cff;   /* header   – violet */
  --lt: #52c98a;   /* token    – emerald */
  --lk: #f4a44a;   /* keygroup – amber */
  --lc: #f07070;   /* char     – coral */
  --le: #70a8d8;   /* enclosure– steel blue */
  --ls: #60c8c0;   /* sample   – teal */

  /* Semantic */
  --success: #52c98a;
  --warn:    #f4a44a;

  /* Typography */
  --sans: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;

  /* Radii */
  --r1: 5px;
  --r2: 8px;
  --r3: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--sans);
  font-size: 13px;
  background: var(--s0);
  color: var(--t0);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout shell ─────────────────────────────────────────────────────────── */
body { display: flex; flex-direction: column; }

.titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  height: 46px;
  background: var(--s1);
  border-bottom: 1px solid var(--s4);
  flex-shrink: 0;
}
.tl-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--t0);
  letter-spacing: -.01em;
  margin-right: 6px;
}
.tl-logo i {
  font-size: 18px;
  background: linear-gradient(135deg, var(--lh), var(--a));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tl-logo span { color: var(--a); }
.tl-sep { flex: 1; }
.vsep { width: 1px; height: 18px; background: var(--s4); margin: 0 2px; }

.tbtn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: var(--r1);
  border: 1px solid var(--s4);
  background: transparent;
  color: var(--t1);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all .15s;
  white-space: nowrap;
}
.tbtn i { font-size: 13px; }
.tbtn:hover { background: var(--s2); border-color: var(--s5); color: var(--t0); }
.tbtn.hi {
  background: var(--a-bg);
  border-color: var(--a-bd);
  color: var(--a);
}
.tbtn.hi:hover { background: rgba(108,138,255,.2); }

#app {
  display: grid;
  grid-template-columns: 174px 1fr 220px;
  flex: 1;
  min-height: 0;
  position: relative;
}

/* ── Palette sidebar ──────────────────────────────────────────────────────── */
.sidebar {
  background: var(--s1);
  border-right: 1px solid var(--s4);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel-hd {
  font-size: 10px;
  font-weight: 600;
  color: var(--t2);
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 12px 12px 8px;
  border-bottom: 1px solid var(--s4);
  flex-shrink: 0;
}
.pal-list {
  padding: 9px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  flex: 1;
}
.pal-group {
  font-size: 10px;
  font-weight: 600;
  color: var(--t2);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 8px 4px 4px;
}
.pc {
  padding: 8px 10px;
  border-radius: var(--r2);
  border: 1px solid var(--s4);
  cursor: grab;
  user-select: none;
  background: var(--s2);
  transition: border-color .15s, background .15s, transform .1s;
  position: relative;
}
.pc:hover  { border-color: var(--s5); background: var(--s3); transform: translateY(-1px); }
.pc:active { cursor: grabbing; opacity: .7; transform: translateY(0); }
.pc-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--t0);
  display: flex;
  align-items: center;
  gap: 6px;
}
.pc-name i { font-size: 14px; }
.pc-hint   { font-size: 10px; color: var(--t2); margin-top: 2px; padding-left: 20px; }
.pc-once {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 20px;
  background: var(--a-bg);
  color: var(--a);
  border: 1px solid var(--a-bd);
  margin-left: auto;
  flex-shrink: 0;
  letter-spacing: .02em;
}

/* ── Canvas ───────────────────────────────────────────────────────────────── */
.canvas-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--s0);
}
.canvas {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  align-items: stretch;
}

/* ── Lane ─────────────────────────────────────────────────────────────────── */
.lane {
  border-radius: var(--r3);
  border: 1px solid var(--s4);
  background: var(--s1);
  flex-shrink: 0;
  transition: border-color .15s;
}
.lane-hd {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--s4);
  border-radius: var(--r3) var(--r3) 0 0;
}
/* Lane header icon pill */
.lane-ico {
  width: 26px;
  height: 26px;
  border-radius: var(--r1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
}
.lane-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--t0);
  flex: 1;
  letter-spacing: -.01em;
}
.lane-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--t2);
  font-family: var(--mono);
}
.lane-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 46px;
  border-radius: 0 0 var(--r3) var(--r3);
  transition: background .15s;
}
.lane-body.over {
  background: var(--a-bg);
  outline: 1.5px dashed var(--a-bd);
  outline-offset: -2px;
}
.lane-body.reject {
  background: var(--d-bg);
  outline: 1.5px dashed var(--d);
  outline-offset: -2px;
}
.lane-empty {
  font-size: 11px;
  color: var(--t2);
  padding: 6px 4px;
  text-align: center;
  font-style: italic;
}

/* ── Cards ────────────────────────────────────────────────────────────────── */
.card {
  border-radius: var(--r2);
  border: 1px solid var(--s4);
  background: var(--s2);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  user-select: none;
}
.card:hover { border-color: var(--s5); background: var(--s3); }
.card.sel {
  border-color: var(--a);
  background: var(--s2);
  box-shadow: 0 0 0 2px var(--a-bg);
}
.card-hd {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
}
.card-ico { font-size: 13px; flex-shrink: 0; }
.card-lbl {
  font-size: 12px;
  font-weight: 500;
  color: var(--t0);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-rm {
  font-size: 12px;
  color: var(--t2);
  opacity: .4;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
  flex-shrink: 0;
  transition: opacity .12s, color .12s;
}
.card-rm:hover { opacity: 1; color: var(--d); }
.card-body  { padding: 1px 10px 8px; display: flex; flex-direction: column; gap: 3px; }
.cr {
  font-size: 10px;
  color: var(--t1);
  display: flex;
  gap: 5px;
  align-items: baseline;
  flex-wrap: wrap;
}
.cr b    { color: var(--t0); font-weight: 500; }
.cr .mn  { font-family: var(--mono); font-size: 10px; color: var(--t0); }
.chips   { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 20px;
  border: 1px solid var(--s4);
  color: var(--t1);
  background: var(--s0);
  font-family: var(--mono);
}

/* ── Inspector ────────────────────────────────────────────────────────────── */
.insp {
  background: var(--s1);
  border-left: 1px solid var(--s4);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.insp-body {
  padding: 11px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.insp-nil {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 7px;
  opacity: .3;
}
.insp-nil i { font-size: 26px; }
.insp-nil p { font-size: 11px; text-align: center; line-height: 1.5; }
.isec {
  font-size: 10px;
  font-weight: 600;
  color: var(--t2);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--s4);
  margin-bottom: 1px;
}
.fg  { display: flex; flex-direction: column; gap: 4px; }
.fl  { font-size: 11px; font-weight: 500; color: var(--t1); }
.fhint { font-size: 10px; color: var(--t2); margin-top: -1px; }
.fi {
  font-family: var(--sans);
  font-size: 12px;
  padding: 6px 9px;
  border-radius: var(--r1);
  border: 1px solid var(--s4);
  background: var(--s2);
  color: var(--t0);
  width: 100%;
  outline: none;
  transition: border-color .15s;
}
.fi:focus   { border-color: var(--a); }
.fi:disabled{ opacity: .3; cursor: not-allowed; }
.fi.mn      { font-family: var(--mono); font-size: 11px; }
.fta        { min-height: 64px; resize: vertical; line-height: 1.55; }
.crow       { display: flex; align-items: center; gap: 7px; }
.stb {
  font-family: var(--sans);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--r1);
  border: 1px solid var(--s4);
  cursor: pointer;
  background: var(--s2);
  color: var(--t1);
  transition: all .15s;
}
.stb.on { background: var(--a-bg); color: var(--a); border-color: var(--a-bd); }
/* validation state on input */
.fi.err { border-color: var(--d); }
.fhint.err { color: var(--d); }

.kw-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
.kwc {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--s2);
  border: 1px solid var(--s4);
  color: var(--t1);
  cursor: pointer;
  font-family: var(--mono);
  transition: border-color .1s, color .1s;
}
.kwc:hover { border-color: var(--d); color: var(--d); }
.kwr { display: flex; gap: 5px; }
.kwr .fi { flex: 1; }
.addb {
  font-family: var(--sans);
  font-size: 11px;
  padding: 6px 10px;
  border-radius: var(--r1);
  border: 1px solid var(--s4);
  background: transparent;
  color: var(--t1);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.addb:hover { background: var(--s2); border-color: var(--s5); color: var(--t0); }

/* class name display — TSyn·[name]·Syn */
.cn-preview {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 9px;
  border-radius: var(--r1);
  background: var(--s0);
  border: 1px solid var(--s4);
  color: var(--t0);
  display: flex;
  align-items: center;
  gap: 0;
  margin-top: 2px;
}
.cn-fixed { color: var(--t2); }
.cn-core  { color: var(--a); font-weight: 500; }

input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--a);
  cursor: pointer;
  flex-shrink: 0;
}

/* ── Modal ────────────────────────────────────────────────────────────────── */
.modal-wrap {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--s1);
  border-radius: var(--r3);
  border: 1px solid var(--s5);
  width: 540px; max-height: 580px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,.6);
}
.modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px;
  border-bottom: 1px solid var(--s4);
  flex-shrink: 0;
}
.modal-hd h3 { font-size: 13px; font-weight: 600; color: var(--t0); }
.modal-cl {
  font-size: 17px; cursor: pointer; color: var(--t1);
  padding: 2px 5px; border-radius: 4px;
  transition: color .12s;
}
.modal-cl:hover { color: var(--t0); }
.modal-body { padding: 15px; overflow-y: auto; flex: 1; }
.msg-pre {
  font-family: var(--mono);
  font-size: 11px; line-height: 1.9;
  color: var(--t0);
  white-space: pre-wrap; word-break: break-all;
  background: var(--s0);
  padding: 12px 14px;
  border-radius: var(--r2);
  border: 1px solid var(--s4);
}
.t-delim { color: var(--a); }
.t-kw    { color: var(--warn); }
.t-val   { color: var(--success); }
.t-body  { color: var(--t2); }

/* ── Scrollbars ───────────────────────────────────────────────────────────── */
::-webkit-scrollbar       { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--s5); }
</style>
</head>
<body>

<!-- ── Title bar ─────────────────────────────────────────────────────────── -->
<div class="titlebar">
  <div class="tl-logo">
    <i class="ti ti-adjustments-horizontal"></i>
    SynEdit&thinsp;<span>.msg</span>&thinsp;Designer
  </div>
  <div class="tl-sep"></div>
  <button class="tbtn" onclick="loadExample()"><i class="ti ti-bolt"></i>Example</button>
  <button class="tbtn" onclick="clearAll()"><i class="ti ti-trash"></i>Clear</button>
  <div class="vsep"></div>
  <button class="tbtn" onclick="doValidate()"><i class="ti ti-shield-check"></i>Validate</button>
  <button class="tbtn hi" onclick="showPreview()"><i class="ti ti-file-export"></i>Generate .msg</button>
</div>

<div id="app">

  <!-- ── Palette ───────────────────────────────────────────────────────────── -->
  <div class="sidebar">
    <div class="panel-hd">Palette</div>
    <div class="pal-list" id="pal">

      <div class="pal-group">Structure</div>

      <div class="pc" draggable="true" data-type="header">
        <div class="pc-name"><i class="ti ti-file-text" style="color:var(--lh)"></i>Header<span class="pc-once">1 max</span></div>
        <div class="pc-hint">Class · prefix · ident chars</div>
      </div>

      <div class="pc" draggable="true" data-type="sample">
        <div class="pc-name"><i class="ti ti-code" style="color:var(--ls)"></i>Sample source<span class="pc-once">1 max</span></div>
        <div class="pc-hint">Preview code block</div>
      </div>

      <div class="pal-group">Tokens</div>

      <div class="pc" draggable="true" data-type="tokentype">
        <div class="pc-name"><i class="ti ti-tag" style="color:var(--lt)"></i>Token type</div>
        <div class="pc-hint">Name + colour style</div>
      </div>

      <div class="pal-group">Keywords</div>

      <div class="pc" draggable="true" data-type="keygroup">
        <div class="pc-name"><i class="ti ti-list" style="color:var(--lk)"></i>Key group</div>
        <div class="pc-hint">KEYS keyword list</div>
      </div>

      <div class="pal-group">Rules</div>

      <div class="pc" draggable="true" data-type="charrule">
        <div class="pc-name"><i class="ti ti-braces" style="color:var(--lc)"></i>Char rule</div>
        <div class="pc-hint">CHARS dispatch</div>
      </div>

      <div class="pc" draggable="true" data-type="enclosure">
        <div class="pc-name"><i class="ti ti-brackets" style="color:var(--le)"></i>Enclosure</div>
        <div class="pc-hint">ENCLOSEDBY pair</div>
      </div>

    </div>
  </div>

  <!-- ── Canvas ────────────────────────────────────────────────────────────── -->
  <div class="canvas-col">
    <div class="canvas" id="canvas"></div>
  </div>

  <!-- ── Inspector ─────────────────────────────────────────────────────────── -->
  <div class="insp">
    <div class="panel-hd">Inspector</div>
    <div class="insp-body" id="insp"></div>
  </div>

</div>

<script>
'use strict'

/* ── Lane config: icon replaces coloured dot ────────────────────────────── */
const LANE_CFG = [
  { id:'header',     label:'Header',        ico:'ti-file-text', color:'var(--lh)', type:'header',    multi:false },
  { id:'tokentype',  label:'Token types',   ico:'ti-tag',       color:'var(--lt)', type:'tokentype', multi:true  },
  { id:'keygroup',   label:'Key groups',    ico:'ti-list',      color:'var(--lk)', type:'keygroup',  multi:true  },
  { id:'chars',      label:'Char rules',    ico:'ti-braces',    color:'var(--lc)', type:'charrule',  multi:true  },
  { id:'enclosedby', label:'Enclosed by',   ico:'ti-brackets',  color:'var(--le)', type:'enclosure', multi:true  },
  { id:'sample',     label:'Sample source', ico:'ti-code',      color:'var(--ls)', type:'sample',    multi:false },
]

/* ── Doc model ──────────────────────────────────────────────────────────── */
const doc = {}
LANE_CFG.forEach(l => doc[l.id] = [])

let sel = null, dragPalType = null, dragCardId = null, idSeq = 0
const mkid = () => ++idSeq

/* ── Class name helpers (refinement 2 & 3) ──────────────────────────────── */

// Strip everything except letters, digits and underscores
function sanitizeIdent(raw) {
  return raw.replace(/[^A-Za-z0-9_]/g, '')
}

// Given whatever the user typed, return the canonical TSyn…Syn class name
// and the extracted "core" fragment for display
function buildClassName(raw) {
  let core = sanitizeIdent(raw)
  // strip leading TSyn / trailing Syn the user may have already typed
  core = core.replace(/^TSyn/i, '').replace(/Syn$/i, '')
  if (!core) core = 'Custom'
  // capitalise first letter
  core = core.charAt(0).toUpperCase() + core.slice(1)
  return { full: 'TSyn' + core + 'Syn', core }
}

/* ── Default card factories ─────────────────────────────────────────────── */
function defCard(type) {
  const id = mkid()
  switch(type) {
    case 'header':
      return { id, type, classCore:'Custom', prefix:'tk',
               identStart:"'_', 'a'..'z', 'A'..'Z'",
               identCont:"'_', '0'..'9', 'a'..'z', 'A'..'Z'" }
    case 'tokentype':
      return { id, type, name:'NewToken',
               hasFG:false, fg:'clWindowText',
               hasBG:false, bg:'clWindow',
               hasStyle:false, bold:false, italic:false, underline:false, strikeout:false }
    case 'keygroup':
      return { id, type, groupName:'keywords', words:[] }
    case 'charrule':
      return { id, type, charset:"'A'..'Z', 'a'..'z', '_'", procName:'Ident', body:'' }
    case 'enclosure':
      return { id, type, tokenType:'Comment', ruleName:'BraceComment',
               openSeq:'{', closeSeq:'}', multiLine:true }
    case 'sample':
      return { id, type, text:'; sample source\nmov rax, 1\nsyscall' }
  }
}

/* ── Model helpers ──────────────────────────────────────────────────────── */
function findCard(id) {
  for (const l of LANE_CFG) { const c = doc[l.id].find(c=>c.id===id); if(c) return c }
  return null
}
function laneIdForCard(id) {
  for (const l of LANE_CFG) { if(doc[l.id].some(c=>c.id===id)) return l.id }
  return null
}
function addCard(type, laneId) {
  const lane = LANE_CFG.find(l=>l.id===laneId)
  if (!lane) return
  if (!lane.multi && doc[laneId].length >= 1) doc[laneId] = []
  const c = defCard(type)
  doc[laneId].push(c)
  sel = c.id
  render(); renderInsp()
}
function removeCard(id) {
  const lid = laneIdForCard(id)
  if (lid) doc[lid] = doc[lid].filter(c=>c.id!==id)
  if (sel===id) sel=null
  render(); renderInsp()
}
function upd(id,k,v) { const c=findCard(id); if(c){c[k]=v;render()} }
function tog(id,k)   { const c=findCard(id); if(c){c[k]=!c[k];render();renderInsp()} }

/* ── Class name update (refinement 2 & 3) ──────────────────────────────── */
function updClassName(id, raw) {
  const c = findCard(id)
  if (!c) return
  // Store only the sanitised core — full name is always derived
  const { core } = buildClassName(raw)
  c.classCore = core
  render()
  // Update the preview span without full re-render of inspector
  const prev = document.getElementById('cn-core-' + id)
  if (prev) prev.textContent = core
}

/* ── Keyword helpers ────────────────────────────────────────────────────── */
function rmW(id,i)  { const c=findCard(id); if(c){c.words.splice(i,1);render();renderInsp()} }
function addW(id)   {
  const el=document.getElementById('kwi-'+id), c=findCard(id)
  if(!el||!c) return
  const w=el.value.trim()
  if(w&&!c.words.includes(w)){c.words.push(w);el.value='';render();renderInsp()}
}
function bulkW(id,v) {
  const c=findCard(id); if(!c) return
  v.split('\n').map(s=>s.trim()).filter(s=>s&&!c.words.includes(s)).forEach(s=>c.words.push(s))
  render(); renderInsp()
}

/* ── Card rendering ─────────────────────────────────────────────────────── */
function cardIcon(type) {
  return {header:'ti-file-text',tokentype:'ti-tag',keygroup:'ti-list',
          charrule:'ti-braces',enclosure:'ti-brackets',sample:'ti-code'}[type]||'ti-circle'
}
function cardLabel(c) {
  if(c.type==='header')    return buildClassName(c.classCore||'Custom').full
  if(c.type==='tokentype') return c.name
  if(c.type==='keygroup')  return c.groupName
  if(c.type==='charrule')  return c.procName
  if(c.type==='enclosure') return c.ruleName
  if(c.type==='sample')    return 'Sample source'
  return ''
}
function cardBodyHtml(c) {
  if(c.type==='header') {
    const { full } = buildClassName(c.classCore||'Custom')
    return `<div class="cr"><span>Class</span><b>${esc(full)}</b></div>
            <div class="cr"><span>Prefix</span><b>${esc(c.prefix)}</b></div>`
  }
  if(c.type==='tokentype') {
    const p=[]
    if(c.hasBG) p.push('BG:'+c.bg)
    if(c.hasFG) p.push('FG:'+c.fg)
    const st=[c.bold&&'B',c.italic&&'I',c.underline&&'U',c.strikeout&&'S'].filter(Boolean)
    if(c.hasStyle&&st.length) p.push('['+st.join('')+']')
    return `<div class="cr">${esc(p.join(' · ')||'default style')}</div>`
  }
  if(c.type==='keygroup') {
    if(!c.words.length) return `<div class="cr" style="opacity:.35;font-style:italic">no keywords yet</div>`
    const prev=c.words.slice(0,6), more=c.words.length-6
    return `<div class="chips">${prev.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}${more>0?`<span class="chip">+${more}</span>`:''}</div>`
  }
  if(c.type==='charrule') {
    return `<div class="cr"><b class="mn">${esc(c.charset)}</b></div>
            ${c.body.trim()?`<div class="cr" style="opacity:.5;font-style:italic">has proc body</div>`:''}`
  }
  if(c.type==='enclosure') {
    return `<div class="cr"><span>${esc(c.tokenType)}</span><b class="mn">${esc(c.openSeq)}…${esc(c.closeSeq)}</b><span>${c.multiLine?'multi':'single'}</span></div>`
  }
  if(c.type==='sample') {
    const lines=c.text.split('\n')
    return `<div class="cr mn" style="font-size:10px">${esc(lines.slice(0,2).join(' ↵ '))}${lines.length>2?' …':''}</div>`
  }
  return ''
}
function cardHtml(c, color) {
  const body=cardBodyHtml(c)
  return `<div class="card${c.id===sel?' sel':''}" id="c${c.id}"
    onclick="selectCard(${c.id})" draggable="true"
    ondragstart="onCDS(event,${c.id})" ondragover="onCDO(event,${c.id})" ondrop="onCDP(event,${c.id})">
    <div class="card-hd">
      <i class="ti ${cardIcon(c.type)} card-ico" style="color:${color}"></i>
      <span class="card-lbl">${esc(cardLabel(c))}</span>
      <span class="card-rm" onclick="event.stopPropagation();removeCard(${c.id})" title="Remove"><i class="ti ti-x"></i></span>
    </div>
    ${body?`<div class="card-body">${body}</div>`:''}
  </div>`
}

/* ── Render canvas (refinement 1: lane-ico instead of lane-dot) ─────────── */
function render() {
  document.getElementById('canvas').innerHTML = LANE_CFG.map(lane => {
    const cards = doc[lane.id]
    const typeName = lane.type.replace('tokentype','token type').replace('keygroup','key group').replace('charrule','char rule')
    return `<div class="lane">
      <div class="lane-hd">
        <div class="lane-ico" style="background:${lane.color}1a">
          <i class="ti ${lane.ico}" style="color:${lane.color}"></i>
        </div>
        <span class="lane-title">${lane.label}</span>
        <span class="lane-badge">${cards.length?cards.length+(cards.length===1?' card':' cards'):''}</span>
      </div>
      <div class="lane-body" id="lb-${lane.id}"
        ondragover="onLDO(event,'${lane.id}')"
        ondragleave="onLDL('${lane.id}')"
        ondrop="onLDP(event,'${lane.id}')">
        ${cards.length
          ? cards.map(c=>cardHtml(c,lane.color)).join('')
          : `<div class="lane-empty">drag a ${typeName} card here</div>`}
      </div>
    </div>`
  }).join('')
}

/* ── Render inspector ───────────────────────────────────────────────────── */
function selectCard(id) { sel=id; render(); renderInsp() }

function renderInsp() {
  const insp=document.getElementById('insp')
  const c=sel?findCard(sel):null
  if(!c) {
    insp.innerHTML=`<div class="insp-nil"><i class="ti ti-cursor-text"></i><p>Select a card<br>to edit its properties</p></div>`
    return
  }
  const fld=(label,key,val,mono=false,hint='')=>
    `<div class="fg"><div class="fl">${label}</div>
      <input class="fi${mono?' mn':''}" value="${esc(String(val??''))}" oninput="upd(${c.id},'${key}',this.value)">
      ${hint?`<div class="fhint">${hint}</div>`:''}
    </div>`
  const stb=(k,l)=>`<button class="stb${c[k]?' on':''}" onclick="tog(${c.id},'${k}')">${l}</button>`

  let h=''

  if(c.type==='header') {
    const {full,core}=buildClassName(c.classCore||'Custom')
    h=`<div class="isec">Identity</div>
    <div class="fg">
      <div class="fl">Highlighter name</div>
      <input class="fi" value="${esc(c.classCore||'')}" placeholder="e.g. Pascal"
        oninput="updClassName(${c.id},this.value)">
      <div class="fhint">Type any name — TSyn…Syn is added automatically</div>
      <div class="cn-preview">
        <span class="cn-fixed">TSyn</span><span class="cn-core" id="cn-core-${c.id}">${esc(core)}</span><span class="cn-fixed">Syn</span>
      </div>
    </div>
    ${fld('Token prefix','prefix',c.prefix,true,'Prefix for TtkTokenKind enum values')}
    <div class="isec" style="margin-top:2px">Identifier characters</div>
    ${fld('Identifier start','identStart',c.identStart,true)}
    ${fld('Identifier continue','identCont',c.identCont,true)}`
  }

  else if(c.type==='tokentype') {
    /* refinement 5: "Identifier" token replaced by "Section" in the inspector label */
    const dispName = c.name==='Identifier' ? 'Section' : c.name
    h=`<div class="isec">Token</div>
    <div class="fg"><div class="fl">Token name</div>
      <input class="fi" value="${esc(c.name)}" oninput="upd(${c.id},'name',this.value)">
      <div class="fhint">Used as the TtkTokenKind enum value name</div>
    </div>
    <div class="isec" style="margin-top:2px">Style</div>
    <div class="fg"><div class="fl">Foreground</div>
      <div class="crow">
        <input type="checkbox" ${c.hasFG?'checked':''} onchange="upd(${c.id},'hasFG',this.checked);renderInsp()">
        <input class="fi" style="flex:1" value="${esc(c.fg)}" ${!c.hasFG?'disabled':''} oninput="upd(${c.id},'fg',this.value)">
      </div></div>
    <div class="fg"><div class="fl">Background</div>
      <div class="crow">
        <input type="checkbox" ${c.hasBG?'checked':''} onchange="upd(${c.id},'hasBG',this.checked);renderInsp()">
        <input class="fi" style="flex:1" value="${esc(c.bg)}" ${!c.hasBG?'disabled':''} oninput="upd(${c.id},'bg',this.value)">
      </div></div>
    <div class="fg"><div class="fl">Font style</div>
      <div class="crow">
        <input type="checkbox" ${c.hasStyle?'checked':''} onchange="upd(${c.id},'hasStyle',this.checked);renderInsp()">
        <div class="crow">${stb('bold','<b>B</b>')}${stb('italic','<i>I</i>')}${stb('underline','<u>U</u>')}${stb('strikeout','<s>S</s>')}</div>
      </div></div>`
  }

  else if(c.type==='keygroup') {
    const chips=c.words.map((w,i)=>`<span class="kwc" onclick="rmW(${c.id},${i})" title="click to remove">${esc(w)} ×</span>`).join('')
    h=`<div class="isec">Group</div>
    ${fld('Group name','groupName',c.groupName,false,'Must match a token type name')}
    <div class="isec" style="margin-top:2px">Keywords (${c.words.length})</div>
    <div class="fg">
      <div class="kw-chips">${chips||'<span style="font-size:10px;color:var(--t2);font-style:italic">none yet</span>'}</div>
      <div class="kwr">
        <input class="fi" id="kwi-${c.id}" placeholder="type keyword…" onkeydown="if(event.key==='Enter')addW(${c.id})">
        <button class="addb" onclick="addW(${c.id})">Add</button>
      </div>
      <textarea class="fi fta" style="margin-top:5px" placeholder="or paste multiple, one per line…"
        oninput="bulkW(${c.id},this.value)" onblur="this.value=''"></textarea>
    </div>`
  }

  else if(c.type==='charrule') {
    h=`<div class="isec">Character set</div>
    ${fld('Char set expression','charset',c.charset,true)}
    <div class="isec" style="margin-top:2px">Procedure</div>
    ${fld('Proc name','procName',c.procName)}
    <div class="fg"><div class="fl">BeginProc body <span style="font-weight:400;color:var(--t2)">(optional)</span></div>
      <textarea class="fi fta mn" oninput="upd(${c.id},'body',this.value)">${esc(c.body)}</textarea>
    </div>`
  }

  else if(c.type==='enclosure') {
    h=`<div class="isec">Enclosure</div>
    ${fld('Token type','tokenType',c.tokenType,false,'Must match a token type name')}
    ${fld('Rule name','ruleName',c.ruleName)}
    <div class="isec" style="margin-top:2px">Delimiters</div>
    ${fld('Open sequence','openSeq',c.openSeq,true)}
    ${fld('Close sequence','closeSeq',c.closeSeq,true)}
    <div class="fg"><div class="fl">Multi-line</div>
      <input type="checkbox" ${c.multiLine?'checked':''} onchange="upd(${c.id},'multiLine',this.checked)">
    </div>`
  }

  else if(c.type==='sample') {
    h=`<div class="isec">Sample source</div>
    <div class="fg">
      <textarea class="fi fta mn" style="min-height:150px" oninput="upd(${c.id},'text',this.value)">${esc(c.text)}</textarea>
    </div>`
  }

  insp.innerHTML=h
}

/* ── Drag & drop — palette → lane ───────────────────────────────────────── */
function onLDO(e,lid) {
  if(!dragPalType) return
  const lane=LANE_CFG.find(l=>l.id===lid)
  if(!lane) return
  const body=document.getElementById('lb-'+lid)
  if(!body) return
  if(lane.type!==dragPalType) { e.preventDefault(); body.classList.add('reject'); return }
  e.preventDefault(); body.classList.add('over')
}
function onLDL(lid) {
  const b=document.getElementById('lb-'+lid)
  if(b){b.classList.remove('over');b.classList.remove('reject')}
}
function onLDP(e,lid) {
  onLDL(lid)
  if(!dragPalType) return
  const lane=LANE_CFG.find(l=>l.id===lid)
  if(!lane||lane.type!==dragPalType) return
  e.preventDefault()
  addCard(dragPalType,lid)
  dragPalType=null
}

/* ── Drag & drop — card reorder ─────────────────────────────────────────── */
function onCDS(e,id) { dragCardId=id; dragPalType=null; e.stopPropagation() }
function onCDO(e,id) { if(!dragCardId)return; e.preventDefault(); e.stopPropagation() }
function onCDP(e,targetId) {
  e.preventDefault(); e.stopPropagation()
  if(!dragCardId||dragCardId===targetId) return
  const srcL=laneIdForCard(dragCardId), tgtL=laneIdForCard(targetId)
  if(srcL===tgtL) {
    const arr=doc[srcL]
    const fi=arr.findIndex(c=>c.id===dragCardId), ti=arr.findIndex(c=>c.id===targetId)
    if(fi>=0&&ti>=0){const[m]=arr.splice(fi,1);arr.splice(ti,0,m)}
  }
  dragCardId=null; render()
}

/* ── Wire palette drag ──────────────────────────────────────────────────── */
document.getElementById('pal').querySelectorAll('.pc').forEach(el=>{
  el.addEventListener('dragstart',()=>{dragPalType=el.dataset.type;dragCardId=null})
  el.addEventListener('dragend',()=>{dragPalType=null})
})

/* ── .msg generation ────────────────────────────────────────────────────── */
function buildStyleStr(c) {
  const p=[]
  if(c.hasBG) p.push('Background='+c.bg)
  if(c.hasFG) p.push('Foreground='+c.fg)
  if(c.hasStyle) {
    const st=[c.bold&&'fsBold',c.italic&&'fsItalic',c.underline&&'fsUnderline',c.strikeout&&'fsStrikeOut'].filter(Boolean)
    if(st.length) p.push('Style=['+st.join(', ')+']')
  }
  return p.join('|')
}

function generateMsg() {
  const D='|><|', L=[]
  const hdr=doc.header[0]
  if(hdr) {
    const {full}=buildClassName(hdr.classCore||'Custom')
    L.push(full, hdr.prefix, 'IdentStart '+hdr.identStart+' :: '+hdr.identCont+'::')
  } else {
    L.push('TSynCustomSyn','tk',"IdentStart '_', 'a'..'z', 'A'..'Z' :: '_', '0'..'9', 'a'..'z', 'A'..'Z'::")
  }
  const tt=doc.tokentype
  if(tt.length){L.push(D,'TOKENTYPES');tt.forEach(c=>{const s=buildStyleStr(c);L.push(s?c.name+' '+s:c.name)})}
  doc.keygroup.forEach(c=>{L.push(D,'KEYS '+c.groupName);c.words.forEach(w=>L.push(w))})
  const cr=doc.chars
  if(cr.length){L.push(D,'CHARS');cr.forEach(c=>{L.push(c.charset+':: '+c.procName);if(c.body.trim()){L.push('BeginProc');c.body.split('\n').forEach(l=>L.push('  '+l));L.push('EndProc')}})}
  const enc=doc.enclosedby
  if(enc.length){L.push(D,'ENCLOSEDBY');enc.forEach(c=>L.push([c.tokenType,c.ruleName,c.openSeq,c.closeSeq,c.multiLine?'MultiLine':''].filter(Boolean).join(',')))}
  const smp=doc.sample[0]
  if(smp){L.push(D,'SAMPLESOURCE');smp.text.split('\n').forEach(l=>L.push(l))}
  L.push(D)
  return L.join('\n')
}

/* ── Preview modal ──────────────────────────────────────────────────────── */
function colourMsg(text) {
  return text.split('\n').map(line=>{
    if(line==='|><|') return `<span class="t-delim">${esc(line)}</span>`
    if(/^(TOKENTYPES|KEYS |CHARS|ENCLOSEDBY|SAMPLESOURCE|IdentStart)/.test(line)) return `<span class="t-kw">${esc(line)}</span>`
    if(/^\s/.test(line)&&line.trim()) return `<span class="t-body">${esc(line)}</span>`
    if(/^(BeginProc|EndProc)/.test(line)) return `<span class="t-body">${esc(line)}</span>`
    return `<span class="t-val">${esc(line)}</span>`
  }).join('\n')
}

function showPreview() {
  if(!LANE_CFG.some(l=>doc[l.id].length>0)){alert('Add some cards first.');return}
  const text=generateMsg()
  const app=document.getElementById('app')
  app.style.position='relative'
  const bg=document.createElement('div')
  bg.className='modal-wrap'
  bg.innerHTML=`<div class="modal">
    <div class="modal-hd">
      <h3>Generated .msg output</h3>
      <span class="modal-cl" onclick="this.closest('.modal-wrap').remove()"><i class="ti ti-x"></i></span>
    </div>
    <div class="modal-body">
      <pre class="msg-pre">${colourMsg(text)}</pre>
      <button class="tbtn" style="margin-top:12px;width:100%;justify-content:center"
        onclick="navigator.clipboard.writeText(${JSON.stringify(text)}).then(()=>{this.innerHTML='<i class=\\'ti ti-check\\'></i> Copied'})">
        <i class="ti ti-copy"></i> Copy to clipboard
      </button>
      <button class="tbtn" style="margin-top:6px;width:100%;justify-content:center"
        onclick="downloadMsg(${JSON.stringify(text)})">
        <i class="ti ti-download"></i> Save as .msg file
      </button>
    </div>
  </div>`
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()})
  app.appendChild(bg)
}

function downloadMsg(text) {
  const hdr=doc.header[0]
  const core=hdr?buildClassName(hdr.classCore||'Custom').core:'Highlighter'
  const a=document.createElement('a')
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}))
  a.download=core+'.msg'
  a.click()
}

/* ── Validate ───────────────────────────────────────────────────────────── */
function doValidate() {
  const errs=[]
  const ttNames=doc.tokentype.map(c=>c.name)
  if(!doc.header.length) errs.push('No Header card — defaults will be used')
  doc.keygroup.forEach(c=>{
    if(!ttNames.includes(c.groupName)) errs.push(`Key group "${c.groupName}" has no matching token type`)
    if(!c.words.length) errs.push(`Key group "${c.groupName}" has no keywords`)
  })
  doc.enclosedby.forEach(c=>{
    if(!ttNames.includes(c.tokenType)) errs.push(`Enclosure "${c.ruleName}" references unknown token type "${c.tokenType}"`)
    if(!c.openSeq) errs.push(`Enclosure "${c.ruleName}" has no open sequence`)
  })
  alert(errs.length?'Issues found:\n\n• '+errs.join('\n• '):'✓ Document is valid — no issues found.')
}

/* ── Clear ──────────────────────────────────────────────────────────────── */
function clearAll() {
  if(LANE_CFG.some(l=>doc[l.id].length)&&!confirm('Clear all lanes?')) return
  LANE_CFG.forEach(l=>doc[l.id]=[])
  sel=null; render(); renderInsp()
}

/* ── Load example ───────────────────────────────────────────────────────── */

  if(LANE_CFG.some(l=>doc[l.id].length)&&!confirm('Replace canvas with x86-64 ASM example?')) return
  LANE_CFG.forEach(l=>doc[l.id]=[]); idSeq=0; sel=null
  const put=(lid,type,extra)=>{const c=Object.assign(defCard(type),extra);doc[lid].push(c);return c}

  const hdr=put('header','header',{classCore:'Asm64',prefix:'tk',
    identStart:"'_', 'a'..'z', 'A'..'Z'",identCont:"'_', '0'..'9', 'a'..'z', 'A'..'Z'"})

  put('tokentype','tokentype',{name:'Identifier'})
  put('tokentype','tokentype',{name:'Comment',hasFG:true,fg:'clNavy',hasStyle:true,italic:true})
  put('tokentype','tokentype',{name:'Space'})

  put('tokentype','tokentype',{name:'registers16bit',hasBG:true,bg:'clSilver',hasFG:true,fg:'clBlue',hasStyle:true,underline:true,italic:true})

  put('tokentype','tokentype',{name:'registers64bit',hasBG:true,bg:'clSilver',hasFG:true,fg:'clBlue',hasStyle:true,underline:true,italic:true})

  put('keygroup','keygroup',{groupName:'registers8bit', words:['ah','al','bh','bl','ch','cl','dh','dl','sil','dil','spl','bpl','r8b','r9b','r10b','r11b','r12b','r13b','r14b','r15b']})
  put('keygroup','keygroup',{groupName:'registers16bit',words:['ax','bx','cx','dx','si','di','sp','bp','r8w','r9w','r10w','r11w','r12w','r13w','r14w','r15w']})
  put('keygroup','keygroup',{groupName:'registers32bit',words:['eax','ebx','ecx','edx','esi','edi','esp','ebp','r8d','r9d','r10d','r11d','r12d','r13d','r14d','r15d']})
  put('keygroup','keygroup',{groupName:'registers64bit',words:['rax','rbx','rcx','rdx','rsi','rdi','rsp','rbp','r8','r9','r10','r11','r12','r13','r14','r15']})

  put('chars','charrule',{charset:"'A'..'Z', 'a'..'z', '_'",procName:'Ident',
    body:"fTokenID := IdentKind(fLine + Run);\ninc(Run, fStringLen);\nwhile IsIdentChar(fLine[Run]) do\n  Inc(Run);"})

  put('enclosedby','enclosure',{tokenType:'Comment',ruleName:'BraceComment', openSeq:'{', closeSeq:'}', multiLine:true})
  put('enclosedby','enclosure',{tokenType:'Comment',ruleName:'CStyleComment',openSeq:'/*',closeSeq:'*/',multiLine:true})
  put('enclosedby','enclosure',{tokenType:'String', ruleName:'String',       openSeq:'"', closeSeq:'"', multiLine:false})

  put('sample','sample',{text:
    "; Hello World — x86_64 NASM assembly for Linux\n"+
    "section .data\n"+
    "    msg db 'Hello, World!', 0xa\n"+
    "    len equ $ - msg\n"+
    "section .text\n"+
    "    global _start\n"+
    "_start:\n"+
    "    mov rax, 1\n"+
    "    mov rdi, 1\n"+
    "    mov rsi, msg\n"+
    "    mov rdx, len\n"+
    "    syscall\n"+
    "    mov rax, 60\n"+
    "    mov rdi, 0\n"+
    "    syscall"})

  sel=hdr.id; render(); renderInsp()
}

/* ── Utility ────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

/* ── Boot ───────────────────────────────────────────────────────────────── */
render(); renderInsp()
